plugins {
    id 'com.android.application'
}

// Signing comes from the workflow (environment), never from the repo.
def ksPath = System.getenv("EC_KEYSTORE")
def buildNumber = (System.getenv("EC_BUILD_NUMBER") ?: "1") as int

android {
    namespace 'com.buttheads.entrycam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.buttheads.entrycam'
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("EC_PASS")
                keyAlias System.getenv("EC_ALIAS")
                keyPassword System.getenv("EC_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false   // media3 RTSP calls are marked 'unstable API'; fine for us
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
