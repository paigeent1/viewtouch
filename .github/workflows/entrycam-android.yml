# Entry Cam (entrycam/): a small Android / Fire TV app that shows one UniFi camera
# full screen. Separate from the ViewTouch app. Builds on every push that touches
# entrycam/, or from the Actions tab.
#
# The APK is published to the release "entrycam-latest", so the Pi can always fetch it from
#   https://github.com/paigeent1/viewtouch/releases/download/entrycam-latest/EntryCam.apk
# and install it with scripts/bin/entrycam-install.
#
# Signing: uses the same ANDROID_KEYSTORE_* secrets as the ViewTouch app when present,
# so updates install over the old one. Without them, each build has a new key and
# entrycam-install uninstalls the old copy first (it re-sends the camera link after).
name: Entry Cam Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'entrycam/**'
      - '.github/workflows/entrycam-android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/entrycam.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
            alias="$KEYSTORE_ALIAS"; pass="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway key."
            alias=entrycam; pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$ks" -alias "$alias" -keyalg RSA -keysize 3072 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Entry Cam" > /dev/null
          fi
          echo "::add-mask::$pass"
          {
            echo "EC_KEYSTORE=$ks"
            echo "EC_ALIAS=$alias"
            echo "EC_PASS=$pass"
            echo "EC_BUILD_NUMBER=$(git rev-list --count HEAD -- entrycam)"
          } >> "$GITHUB_ENV"

      - name: Build
        working-directory: entrycam
        run: |
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/EntryCam.apk
          cp ../dist/EntryCam.apk "../dist/EntryCam-b${EC_BUILD_NUMBER}.apk"
          ls -l ../dist

      - uses: actions/upload-artifact@v6
        with:
          name: EntryCam-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to release entrycam-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Entry Cam build b${EC_BUILD_NUMBER} from ${GITHUB_SHA::7}. Install on the Pi: bash ~/viewtouch-main/scripts/bin/entrycam-install"
          if gh release view entrycam-latest > /dev/null 2>&1; then
            gh release upload entrycam-latest dist/EntryCam.apk --clobber
            gh release edit entrycam-latest --notes "$notes"
          else
            gh release create entrycam-latest dist/EntryCam.apk --title "Entry Cam (latest)" --latest=false --notes "$notes" --target "$GITHUB_SHA"
          fi
