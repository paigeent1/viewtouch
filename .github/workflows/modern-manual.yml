# Builds the user manual's PDF: the demo store's screenshots (the [manual] tests), then LibreOffice.
# The store's own pictures are in modern/docs/manual/img/ (committed); the demo ones (shots/) are made here.
# Run it from Actions (Run workflow) or by pushing a branch named helper/manual-*; the PDF is the
# run's artifact "ViewTouch-manual".
name: Modern manual

on:
  workflow_dispatch:
  push:
    branches: ['helper/manual-*']

permissions:
  contents: read

jobs:
  manual:
    name: Manual PDF (Debian 13, Qt 6.8)
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
    steps:
      - name: Install build tools and LibreOffice
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 g++ cmake ninja-build \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools libgl-dev libssl-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-dialogs \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest \
            libqt6sql6-sqlite qt6-qpa-plugins fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji \
            libreoffice-writer-nogui fonts-liberation2 poppler-utils \
            xvfb xauth libgl1-mesa-dri libegl1 libglx-mesa0

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S modern -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Screenshots (README step 1)
        working-directory: modern
        run: |
          mkdir -p docs/manual/shots
          # OpenGL (Mesa's software renderer) on a virtual X screen: offscreen has no OpenGL in CI.
          VTM_SHOTS=$PWD/docs/manual/shots QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=rhi QSG_RHI_BACKEND=opengl \
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1200x24" ../build/tests/vtm_tests "[manual]" || true
          VTM_SHOTS=$PWD/docs/manual/shots QT_QPA_PLATFORM=offscreen ../build/tests/vtm_tests "[display][ui]" || true
          ls docs/manual/shots | wc -l

      - name: PDF (README step 2)
        working-directory: modern/docs/manual
        run: |
          soffice --headless --convert-to "pdf:writer_web_pdf_Export" manual.html
          pdfinfo manual.pdf | grep -E 'Pages|File size'
          # Every <img> the manual uses must exist, or the PDF has blank spaces.
          missing=$(grep -o '<img[^>]*src="[^"]*"' manual.html | sed 's/.*src="//;s/"$//' | sort -u | while read -r f; do [ -f "$f" ] || echo "$f"; done)
          if [ -n "$missing" ]; then echo "Missing pictures:"; echo "$missing"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ViewTouch-manual
          path: |
            modern/docs/manual/manual.pdf
            modern/docs/manual/shots/
          if-no-files-found: warn
